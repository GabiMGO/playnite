  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; background: #000; }
    body { --cover-size: 170px; --mobile-columns: 2; --cover-text-size: 15px; --cover-pad-top: 13px; --cover-pad-x: 14px; --cover-pad-bottom: 15px; --cover-text-gap: 10px; --cover-line-height: 20px; margin: 0; color: white; font-family: system-ui, sans-serif; }
    .toolbar { position: sticky; z-index: 2; top: 0; display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 18px; background: rgba(0, 0, 0, .9); backdrop-filter: blur(12px); transform: translateY(0); will-change: transform; }
    button, input { min-height: 42px; border: 1px solid #202024; border-radius: 7px; color: #c9c9ce; background: rgba(18, 18, 20, .72); font: inherit; }
    button { padding: 9px 14px; cursor: pointer; }
    button:disabled { border-color: #141416; color: #4d4d55; background: rgba(12, 12, 14, .72); cursor: default; }
    .search-box { position: relative; flex: 1 1 240px; min-width: 160px; }
    .search-box input { width: 100%; padding: 9px 42px 9px 12px; }
    .clear-search { position: absolute; top: 50%; right: 5px; display: none; width: 32px; min-height: 32px; padding: 0; border: 0; border-radius: 50%; color: #57575d; background: #18181c; transform: translateY(-50%); }
    .clear-search::before, .clear-search::after { position: absolute; top: 50%; left: 50%; width: 12px; height: 1px; content: ''; background: currentColor; transform-origin: center; }
    .clear-search::before { transform: translate(-50%, -50%) rotate(45deg); }
    .clear-search::after { transform: translate(-50%, -50%) rotate(-45deg); }
    .clear-search:hover, .clear-search:focus-visible { color: #85858d; background: #202025; }
    .clear-search.visible { display: flex; }
    input::placeholder { color: #707078; }
    button:not(:disabled):hover, button:focus-visible, button[aria-pressed="true"], input:focus-visible { border-color: #484850; color: white; background: #18181c; outline: none; }
    .cover-size-controls { display: flex; flex-direction: column; gap: 3px; width: 34px; }
    .cover-size-controls button { min-height: 19px; height: 19px; padding: 0; border-radius: 6px; font-size: 14px; line-height: 1; }
    main, .platform-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cover-size), 1fr)); gap: 22px; padding: 22px; }
    .platform-group { grid-column: 1 / -1; contain: layout paint; }
    .platform-group h2 { margin: 10px 0 0; font-size: 20px; }
    .platform-group .platform-grid { padding: 14px 0 6px; }
    .cover { position: relative; z-index: 0; margin: 0; overflow: hidden; clip-path: inset(0 round 14px); border-radius: 14px; background: #000; aspect-ratio: 2 / 3; outline: none; isolation: isolate; contain: layout paint; content-visibility: auto; contain-intrinsic-size: 300px 450px; transition: transform 220ms ease, box-shadow 220ms ease; }
    .cover img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; transition: transform 220ms ease; }
    .cover::before, .cover::after { position: absolute; left: 0; right: 0; z-index: 1; content: ''; pointer-events: none; opacity: 0; transition: opacity 180ms ease; }
    .cover::before { top: -3px; left: -3px; right: -3px; height: calc(34% + 6px); background: linear-gradient(to bottom, #000 0, rgba(0, 0, 0, .92) 4px, rgba(0, 0, 0, .58) 38%, transparent); }
    .cover::after { bottom: -3px; left: -3px; right: -3px; height: calc(42% + 6px); background: linear-gradient(to bottom, transparent, rgba(0, 0, 0, .58) 48%, rgba(0, 0, 0, .92) calc(100% - 4px), #000 100%); }
    .cover figcaption { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; padding: var(--cover-pad-top) var(--cover-pad-x) var(--cover-pad-bottom); color: white; font: 600 var(--cover-text-size)/1.2 system-ui, sans-serif; opacity: 0; transition: opacity 180ms ease; pointer-events: none; }
    .cover-top, .cover-bottom { display: flex; align-items: center; justify-content: space-between; gap: var(--cover-text-gap); min-height: var(--cover-line-height); text-shadow: 0 1px 3px rgba(0, 0, 0, .85); }
    .cover-bottom span:first-child { overflow: hidden; white-space: nowrap; }
    .cover-top span:last-child, .cover-bottom span:last-child { flex: 0 0 auto; text-align: right; }
    .cover:not(.suppressed):hover, .cover.active, .cover:focus-visible { z-index: 1; transform: translateY(-5px) scale(1.04); box-shadow: 0 14px 30px rgba(0, 0, 0, .55); }
    .cover:not(.suppressed):hover img, .cover.active img, .cover:focus-visible img { transform: scale(1.05); }
    .cover:not(.suppressed):hover::before, .cover:not(.suppressed):hover::after, .cover.active::before, .cover.active::after, .cover:focus-visible::before, .cover:focus-visible::after, .cover:not(.suppressed):hover figcaption, .cover.active figcaption, .cover:focus-visible figcaption { opacity: 1; }
    .cover:focus-visible { box-shadow: 0 0 0 3px white; }
    body.resizing-covers .cover, body.resizing-covers .cover img, body.resizing-covers .cover::before, body.resizing-covers .cover::after, body.resizing-covers .cover figcaption { transition: none; }
    .empty { grid-column: 1 / -1; padding: 50px 18px; color: #aaaab2; text-align: center; }
    @media (max-width: 600px) {
      .toolbar { padding: 10px; }
      button { flex: 1 1 auto; padding-inline: 10px; }
      .cover-size-controls { flex: 0 0 34px; }
      .search-box { flex-basis: 100%; order: -1; }
      main, .platform-grid { grid-template-columns: repeat(var(--mobile-columns), minmax(0, 1fr)); gap: 14px; padding: 14px; }
      .platform-group .platform-grid { padding: 10px 0 4px; }
      .platform-group h2 { font-size: 17px; }
      .cover { clip-path: inset(0 round 10px); border-radius: 10px; }
       .cover figcaption { padding: var(--cover-pad-top) var(--cover-pad-x) var(--cover-pad-bottom); }
    }
    @media (prefers-reduced-motion: reduce) { .cover, .cover img, .cover::before, .cover::after, .cover figcaption { transition: none; } }
  </style>

  <script>
    const gallery = document.querySelector('#gallery');
    const localCards = [...gallery.querySelectorAll('.cover')];
    const search = document.querySelector('#search');
    const clearSearch = document.querySelector('#clear-search');
    const toolbar = document.querySelector('.toolbar');
    const groupYear = document.querySelector('#group-year');
    const groupPlatform = document.querySelector('#group-platform');
    const coverLarger = document.querySelector('#cover-larger');
    const coverSmaller = document.querySelector('#cover-smaller');
    let cards = localCards;
    let sortKey = 'name';
    let sortDirection = 1;
    let groupMode = null;
    let searchQuery = '';
    let comparisonMode = false;
    let comparisonStatus = '';
    let comparisonRequest = 0;
    let lastScrollY = window.scrollY;
    let toolbarOffset = 0;
    let coverResizeTimer = 0;
    let suppressToolbarScrollUntil = 0;
    const coverSizeStorageKey = 'playnite-gallery-cover-size';
    const mobileColumnsStorageKey = 'playnite-gallery-mobile-columns';
    const mobileQuery = window.matchMedia('(max-width: 600px)');
    const minCoverSize = 125;
    const maxCoverSize = 300;
    const minMobileColumns = 1;
    const maxMobileColumns = 6;
    let coverSize = loadCoverSize();
    let mobileColumns = loadMobileColumns();

    function clampCoverSize(value) {
      const size = Number(value);
      return Number.isFinite(size) ? Math.min(maxCoverSize, Math.max(minCoverSize, Math.round(size))) : null;
    }

    function getStoredCoverSize() {
      try {
        return clampCoverSize(localStorage.getItem(coverSizeStorageKey));
      } catch (_) {
        return null;
      }
    }

    function loadCoverSize() {
      return getStoredCoverSize() || 170;
    }

    function clampMobileColumns(value) {
      const columns = Number(value);
      return Number.isFinite(columns) ? Math.min(maxMobileColumns, Math.max(minMobileColumns, Math.round(columns))) : null;
    }

    function getStoredMobileColumns() {
      try {
        return clampMobileColumns(localStorage.getItem(mobileColumnsStorageKey));
      } catch (_) {
        return null;
      }
    }

    function loadMobileColumns() {
      return getStoredMobileColumns() || 2;
    }

    function getDesktopGridWidth() {
      const styles = getComputedStyle(gallery);
      const padding = parseFloat(styles.paddingLeft) + parseFloat(styles.paddingRight);
      return Math.max(1, gallery.clientWidth - padding);
    }

    function getDesktopGridGap() {
      const styles = getComputedStyle(gallery);
      return parseFloat(styles.columnGap || styles.gap) || 0;
    }

    function getDesktopColumnCount(size) {
      const gap = getDesktopGridGap();
      return Math.max(1, Math.floor((getDesktopGridWidth() + gap) / (Math.max(size, 1) + gap)));
    }

    function getDesktopMinColumnCount() {
      return getDesktopColumnCount(maxCoverSize);
    }

    function getDesktopMaxColumnCount() {
      return getDesktopColumnCount(minCoverSize);
    }

    function getDesktopSizeForColumnCount(columns) {
      const gap = getDesktopGridGap();
      const width = getDesktopGridWidth();
      const target = Math.max(1, columns);
      const minimumForTarget = Math.floor((width + gap) / (target + 1) - gap) + 1;
      const maximumForTarget = Math.floor((width + gap) / target - gap);
      const size = Math.floor((Math.max(minimumForTarget, 1) + Math.max(maximumForTarget, 1)) / 2);
      return Math.min(maxCoverSize, Math.max(minCoverSize, size));
    }

    function changeDesktopColumns(direction) {
      const currentColumns = getDesktopColumnCount(coverSize);
      let nextColumns = direction > 0 ? currentColumns - 1 : currentColumns + 1;
      nextColumns = Math.min(getDesktopMaxColumnCount(), Math.max(getDesktopMinColumnCount(), nextColumns));
      coverSize = getDesktopSizeForColumnCount(nextColumns);
    }

    function saveCoverSize() {
      try {
        localStorage.setItem(coverSizeStorageKey, String(coverSize));
      } catch (_) {
        // Browser settings may block local storage.
      }
    }

    function saveMobileColumns() {
      try {
        localStorage.setItem(mobileColumnsStorageKey, String(mobileColumns));
      } catch (_) {
        // Browser settings may block local storage.
      }
    }

    function updateCoverButtons() {
      if (mobileQuery.matches) {
        coverLarger.disabled = mobileColumns <= minMobileColumns;
        coverSmaller.disabled = mobileColumns >= maxMobileColumns;
      } else {
        const currentColumns = getDesktopColumnCount(coverSize);
        coverLarger.disabled = currentColumns <= getDesktopMinColumnCount();
        coverSmaller.disabled = currentColumns >= getDesktopMaxColumnCount();
      }
    }
 
    function updateCoverTextSize() {
      const visibleCard = cards.find(card => card.isConnected && card.offsetParent !== null) || localCards[0];
      const width = visibleCard ? visibleCard.getBoundingClientRect().width : coverSize;
      const size = Math.min(15, Math.max(8, Math.round(width * 0.075)));
      const padX = Math.min(14, Math.max(7, Math.round(width * 0.082)));
      const padTop = Math.min(13, Math.max(6, Math.round(width * 0.076)));
      const padBottom = Math.min(15, Math.max(7, Math.round(width * 0.088)));
      const gap = Math.min(10, Math.max(5, Math.round(width * 0.059)));
      const lineHeight = Math.min(20, Math.max(11, Math.round(width * 0.118)));
      document.body.style.setProperty('--cover-text-size', `${size}px`);
      document.body.style.setProperty('--cover-pad-x', `${padX}px`);
      document.body.style.setProperty('--cover-pad-top', `${padTop}px`);
      document.body.style.setProperty('--cover-pad-bottom', `${padBottom}px`);
      document.body.style.setProperty('--cover-text-gap', `${gap}px`);
      document.body.style.setProperty('--cover-line-height', `${lineHeight}px`);
    }

    function applyCoverLayout(save = false) {
      updateCoverButtons();
      suppressToolbarScrollUntil = performance.now() + 220;
      document.body.classList.add('resizing-covers');
      document.body.style.setProperty('--cover-size', `${coverSize}px`);
      document.body.style.setProperty('--mobile-columns', String(mobileColumns));
      if (save) {
        if (mobileQuery.matches) {
          saveMobileColumns();
        } else {
          saveCoverSize();
        }
      }
      clearTimeout(coverResizeTimer);
      coverResizeTimer = setTimeout(() => document.body.classList.remove('resizing-covers'), 120);
      requestAnimationFrame(() => {
        updateCoverTextSize();
        lastScrollY = Math.max(0, window.scrollY);
      });
    }

    function compareCards(a, b) {
      if (sortKey === 'playtime') {
        return (Number(a.dataset.playtime) - Number(b.dataset.playtime)) * sortDirection;
      }
      if (sortKey === 'last-played') {
        return (Number(a.dataset.lastPlayed) - Number(b.dataset.lastPlayed)) * sortDirection;
      }
       if (sortKey === 'rating') {
         return (Number(a.dataset.rating) - Number(b.dataset.rating)) * sortDirection;
       }
      return a.dataset.sortName.localeCompare(b.dataset.sortName, undefined, { sensitivity: 'base' }) * sortDirection;
    }

    function normalizeTitle(value) {
      return value.toLocaleLowerCase()
        .normalize('NFKD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\b(?:game of the year|goty|definitive|complete|ultimate|deluxe|gold|enhanced|anniversary|collector'?s|special)\s+edition\b/g, ' ')
        .replace(/\b(?:director'?s cut|remastered|remaster|remake)\b/g, ' ')
        .replace(/&/g, ' and ')
        .replace(/[^a-z0-9]+/g, ' ')
        .trim()
        .replace(/\s+/g, ' ');
    }

    function titleTokens(value) {
      return normalizeTitle(value)
        .split(' ')
        .filter(token => token && !['the', 'a', 'an'].includes(token));
    }

    function similarity(left, right) {
      if (left === right) return 1;
      if (!left.length || !right.length) return 0;
      const previous = Array.from({ length: right.length + 1 }, (_, index) => index);
      for (let i = 1; i <= left.length; i++) {
        let diagonal = previous[0];
        previous[0] = i;
        for (let j = 1; j <= right.length; j++) {
          const above = previous[j];
          previous[j] = Math.min(
            previous[j] + 1,
            previous[j - 1] + 1,
            diagonal + (left[i - 1] === right[j - 1] ? 0 : 1));
          diagonal = above;
        }
      }
      return 1 - previous[right.length] / Math.max(left.length, right.length);
    }

    function titlesMatch(left, right) {
      const aTokens = titleTokens(left);
      const bTokens = titleTokens(right);
      const a = aTokens.join(' ');
      const b = bTokens.join(' ');
      if (a === b) return true;
      if (!a || !b || Math.min(a.length, b.length) < 10) return false;
      if (aTokens[0] !== bTokens[0]) return false;
      if (Math.abs(a.length - b.length) / Math.max(a.length, b.length) > .18) return false;
      if (Math.abs(aTokens.length - bTokens.length) > 1) return false;

      const shorterTokens = aTokens.length <= bTokens.length ? aTokens : bTokens;
      const longerTokens = aTokens.length > bTokens.length ? aTokens : bTokens;
      const sharedTokens = shorterTokens.filter(token => longerTokens.includes(token)).length;
      if (sharedTokens / Math.max(longerTokens.length, 1) < .85) return false;

      return similarity(a, b) >= .94;
    }

    function parseGalleryUrl(value) {
      const match = value.match(/^https:\/\/([a-z0-9-]+)\.github\.io\/([a-z0-9._-]+)\/?$/i);
      return match ? { owner: match[1], repository: match[2], url: value.endsWith('/') ? value : value + '/' } : null;
    }
    function createRemoteCard(game, galleryUrl) {
      const name = game.Name || game.name || '';
      const sortName = game.SortName || game.sortName || name;
      const imagePath = game.ImagePath || game.imagePath || '';
      const coverVersion = game.CoverVersion || game.coverVersion || '';
      const playtimeSeconds = Number(game.PlaytimeSeconds || game.playtimeSeconds || 0);
      const playtime = playtimeSeconds > 0 ? (game.Playtime || game.playtime || 'Not played') : 'Not played';
      const card = document.createElement('figure');
      card.className = 'cover';
      card.tabIndex = 0;
      card.dataset.name = name;
      card.dataset.sortName = sortName;
      card.dataset.playtime = String(playtimeSeconds);
      card.dataset.lastPlayed = String(game.LastPlayed || game.lastPlayed || 0);
      card.dataset.platform = game.Platform || game.platform || 'Other';
      card.dataset.year = String(game.ReleaseYear || game.releaseYear || 'Unknown');
       card.dataset.rating = String(game.RatingScore || game.ratingScore || 0);
      card.setAttribute('aria-label', `${name}, played ${playtime}, platform ${card.dataset.platform}`);

      const image = document.createElement('img');
      const imageUrl = new URL(imagePath, galleryUrl);
      if (coverVersion) imageUrl.searchParams.set('v', coverVersion);
      image.src = imageUrl.href;
      image.alt = name;
      image.loading = 'lazy';
      image.decoding = 'async';
      const caption = document.createElement('figcaption');
       const top = document.createElement('span');
       top.className = 'cover-top';
       const year = document.createElement('span');
       year.textContent = card.dataset.year === 'Unknown' ? '' : card.dataset.year;
       const time = document.createElement('span');
       time.textContent = playtime;
       top.append(year, time);
 
       const bottom = document.createElement('span');
       bottom.className = 'cover-bottom';
       const ratingText = document.createElement('span');
       ratingText.textContent = game.RatingText || game.ratingText || '';
       const ratingScore = document.createElement('span');
       ratingScore.textContent = game.RatingScoreText || game.ratingScoreText || '';
       bottom.append(ratingText, ratingScore);
       caption.append(top, bottom);
      card.append(image, caption);
      card.addEventListener('mouseleave', () => card.classList.remove('suppressed'));
      return card;
    }

    async function compareGallery(parsed) {
      const requestId = ++comparisonRequest;
      comparisonMode = true;
      comparisonStatus = 'Loading gallery...';
      cards = [];
      render();
      try {
        const apiUrl = `https://api.github.com/repos/${parsed.owner}/${parsed.repository}/contents/library.json`;
        const response = await fetch(apiUrl, { headers: { Accept: 'application/vnd.github+json' } });
        if (!response.ok) throw new Error('The gallery data could not be loaded.');
        const file = await response.json();
        const binary = atob((file.content || '').replace(/\s/g, ''));
        const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
        const remoteGames = JSON.parse(new TextDecoder().decode(bytes));
        if (requestId !== comparisonRequest) return;

        const localNames = localCards.map(card => card.dataset.name);
        const missing = remoteGames.filter(game =>
          !localNames.some(localName => titlesMatch(localName, game.Name || game.name || '')));
        cards = missing.map(game => createRemoteCard(game, parsed.url));
        comparisonStatus = '';
        render();
      } catch (error) {
        if (requestId !== comparisonRequest) return;
        cards = [];
        comparisonStatus = error.message || 'The gallery data could not be loaded.';
        render();
      }
    }

    function render() {
      if (comparisonStatus) {
        gallery.replaceChildren();
        const status = document.createElement('p');
        status.className = 'empty';
        status.textContent = comparisonStatus;
        gallery.append(status);
        updateCoverTextSize();
        return;
      }

      const filtered = cards.filter(card =>
        card.dataset.name.toLocaleLowerCase().includes(searchQuery));
      const sorted = [...filtered].sort(compareCards);
      gallery.replaceChildren();

      if (sorted.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = comparisonMode ? 'No games found outside your library.' : 'No games found.';
        gallery.append(empty);
        updateCoverTextSize();
        return;
      }

      if (!groupMode) {
        gallery.append(...sorted);
        updateCoverTextSize();
        return;
      }

      const dataKey = groupMode === 'year' ? 'year' : 'platform';
      const groups = [...new Set(sorted.map(card => card.dataset[dataKey]))];
      groups.sort((a, b) => groupMode === 'year'
        ? (a === 'Unknown' ? 1 : b === 'Unknown' ? -1 : Number(b) - Number(a))
        : a.localeCompare(b, undefined, { sensitivity: 'base' }));

      for (const group of groups) {
        const section = document.createElement('section');
        section.className = 'platform-group';
        const heading = document.createElement('h2');
        heading.textContent = group;
        const grid = document.createElement('div');
        grid.className = 'platform-grid';
        grid.append(...sorted.filter(card => card.dataset[dataKey] === group));
        section.append(heading, grid);
        gallery.append(section);
      }
      updateCoverTextSize();
    }

    document.querySelector('#sort-name').addEventListener('click', event => {
      sortDirection = sortKey === 'name' ? sortDirection * -1 : 1;
      sortKey = 'name';
      event.currentTarget.textContent = sortDirection === 1 ? 'Name: A-Z' : 'Name: Z-A';
      render();
    });

    document.querySelector('#sort-playtime').addEventListener('click', event => {
      sortDirection = sortKey === 'playtime' ? sortDirection * -1 : -1;
      sortKey = 'playtime';
      event.currentTarget.textContent = sortDirection === -1 ? 'Playtime: high-low' : 'Playtime: low-high';
      render();
    });
 
     document.querySelector('#sort-rating').addEventListener('click', event => {
       sortDirection = sortKey === 'rating' ? sortDirection * -1 : -1;
       sortKey = 'rating';
       event.currentTarget.textContent = sortDirection === -1 ? 'Rating: high-low' : 'Rating: low-high';
       render();
     });

    function setGroupMode(mode) {
      groupMode = groupMode === mode ? null : mode;
      groupYear.setAttribute('aria-pressed', groupMode === 'year');
      groupPlatform.setAttribute('aria-pressed', groupMode === 'platform');
      groupYear.textContent = groupMode === 'year' ? 'Ungroup years' : 'Group by year';
      groupPlatform.textContent = groupMode === 'platform' ? 'Ungroup platforms' : 'Group by platform';
      render();
    }

    groupYear.addEventListener('click', () => setGroupMode('year'));
    groupPlatform.addEventListener('click', () => setGroupMode('platform'));

    coverLarger.addEventListener('click', () => {
      if (mobileQuery.matches) {
        mobileColumns = Math.max(minMobileColumns, mobileColumns - 1);
      } else {
        changeDesktopColumns(1);
      }
      applyCoverLayout(true);
    });

    coverSmaller.addEventListener('click', () => {
      if (mobileQuery.matches) {
        mobileColumns = Math.min(maxMobileColumns, mobileColumns + 1);
      } else {
        changeDesktopColumns(-1);
      }
      applyCoverLayout(true);
    });

    document.querySelector('#sort-last-played').addEventListener('click', event => {
      sortDirection = sortKey === 'last-played' ? sortDirection * -1 : -1;
      sortKey = 'last-played';
      event.currentTarget.textContent = sortDirection === -1 ? 'Last played: recent' : 'Last played: oldest';
      render();
    });

    search.addEventListener('input', event => {
      const value = event.currentTarget.value.trim();
      clearSearch.classList.toggle('visible', event.currentTarget.value.length > 0);
      const galleryUrl = parseGalleryUrl(value);
      if (galleryUrl) {
        searchQuery = '';
        compareGallery(galleryUrl);
        return;
      }

      comparisonRequest++;
      comparisonMode = false;
      comparisonStatus = '';
      cards = localCards;
      searchQuery = value.toLocaleLowerCase();
      render();
    });

    clearSearch.addEventListener('click', () => {
      search.value = '';
      comparisonRequest++;
      comparisonMode = false;
      comparisonStatus = '';
      cards = localCards;
      searchQuery = '';
      clearSearch.classList.remove('visible');
      search.focus();
      render();
    });

    document.addEventListener('click', event => {
      const selected = event.target.closest('.cover');
      if (!selected) {
        cards.forEach(card => card.classList.remove('active', 'suppressed'));
        return;
      }
      const wasActive = selected.classList.contains('active');
      cards.forEach(card => card.classList.remove('active', 'suppressed'));
      selected.classList.add(wasActive ? 'suppressed' : 'active');
    });

    localCards.forEach(card => card.addEventListener('mouseleave', () => card.classList.remove('suppressed')));

    window.addEventListener('scroll', () => {
      const currentScrollY = window.scrollY;
      if (performance.now() < suppressToolbarScrollUntil) {
        lastScrollY = Math.max(0, currentScrollY);
        return;
      }
      const toolbarHeight = toolbar.offsetHeight || 1;
      const delta = currentScrollY - lastScrollY;
      if (currentScrollY <= 0) {
        toolbarOffset = 0;
      } else {
        toolbarOffset = Math.min(toolbarHeight, Math.max(0, toolbarOffset + delta));
      }
      toolbar.style.transform = `translateY(-${toolbarOffset}px)`;
      lastScrollY = Math.max(0, currentScrollY);
    }, { passive: true });

    if (mobileQuery.addEventListener) {
      mobileQuery.addEventListener('change', () => applyCoverLayout());
    }

    applyCoverLayout();
    render();
  </script>
</body>
</html>
